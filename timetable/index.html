<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课表导入 / shunliuzx.com</title>
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    .locked{max-width:620px}.import-tools{display:grid;gap:10px}.course-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day-col{border:1px solid var(--line);background:var(--panel-2);min-height:140px}.day-col h4{margin:0;padding:10px;border-bottom:1px solid var(--line);font-size:13px}.course-card{margin:8px;padding:10px;border:1px solid var(--line);background:var(--bg)}.course-card b{font-size:13px}.course-card .meta{display:block;margin-top:4px}.preview-table{display:grid;gap:8px}.pill-row{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);padding:6px 8px;color:var(--muted);font-size:12px}@media(max-width:980px){.course-grid{grid-template-columns:1fr}.day-col{min-height:auto}}
  </style>
</head>
<body data-page="timetable" data-theme="wolf">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="mark">SL</div><div><h1>课表导入</h1><p>PDF timetable import</p></div></div>
      <nav class="nav">
        <a href="/"><b>控制台</b><span>HOME</span></a>
        <a href="/quotes/"><b>名句档案</b><span>Q-01</span></a>
        <a href="/schedule/"><b>日程备忘</b><span>S-02</span></a>
        <a href="/blog/"><b>记录库</b><span>B-03</span></a>
        <a href="/review/"><b>复习计划</b><span>R-04</span></a>
        <a class="active" href="/timetable/"><b>课表导入</b><span>T-05</span></a>
      </nav>
      <div class="themebox"><div class="seg"><button data-theme-set="wolf">冷白</button><button data-theme-set="amber">琥珀</button></div></div>
    </aside>
    <main class="content">
      <section class="topline"><div><div class="kicker">T-05 / Admin Only</div><h2>课表导入</h2></div><div class="statusbar"><span class="chip">PDF IMPORT</span><span class="chip">PRIVATE</span></div></section>
      <section class="grid" id="timetableLocked">
        <div class="panel span-8 locked">
          <h3>需要管理员权限</h3>
          <p>课表属于私人信息。请先在左侧输入管理员口令登录，登录后才能导入和查看。</p>
        </div>
      </section>
      <section class="grid" id="timetableApp" style="display:none">
        <div class="panel span-4">
          <h3>导入 PDF</h3>
          <div class="import-tools">
            <input id="pdfFile" type="file" accept="application/pdf">
            <button class="primary" id="parsePdfBtn" type="button">解析 PDF</button>
            <textarea id="rawText" placeholder="也可以把 PDF 或教务网页里复制出的课表文字粘贴到这里"></textarea>
            <button id="parseTextBtn" type="button">解析文本</button>
            <button id="savePreviewBtn" type="button">保存预览到云端</button>
            <button class="danger" id="clearTimetableBtn" type="button">清空云端课表</button>
            <div class="notice" id="importNotice">等待导入。</div>
          </div>
        </div>
        <div class="panel span-8">
          <h3>解析预览</h3>
          <div class="preview-table" id="previewList"></div>
        </div>
        <div class="panel span-12">
          <h3>已保存课表</h3>
          <div class="course-grid" id="courseGrid"></div>
        </div>
      </section>
      <footer>© 2026 shunliuzx.com</footer>
    </main>
  </div>
  <script src="../assets/site.js"></script>
  <script type="module">
    const $=id=>document.getElementById(id);
    const weekdays=["星期一","星期二","星期三","星期四","星期五","星期六","星期日"];
    let previewItems=[];
    const esc=value=>String(value||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    async function api(path,options){const res=await fetch(path,Object.assign({headers:{"content-type":"application/json"}},options||{}));const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||"请求失败");return data}
    function notice(text){$("importNotice").textContent=text}
    function field(raw,name){const match=raw.match(new RegExp(name+"[:：]([^/\\n]+)"));return match?match[1].trim():""}
    function normalizeLines(text){return text.replace(/\r/g,"").split("\n").map(line=>line.trim()).filter(Boolean)}
    function parseCourseBlock(name,detail,weekday){
      const range=detail.match(/\((\d+)(?:-(\d+))?节\)([^/]+)/);
      if(!range)return null;
      const raw=name+"\n"+detail;
      return {course_name:name.replace(/[◇◆]/g,"").trim(),weekday,weekday_label:weekdays[weekday-1],start_section:Number(range[1]),end_section:Number(range[2]||range[1]),weeks:(range[3]||"").trim(),campus:field(detail,"校区"),location:field(detail,"场地"),teacher:field(detail,"教师"),raw,source:"pdf"};
    }
    function parseText(text){
      const lines=normalizeLines(text),items=[];let weekday=1;
      for(let i=0;i<lines.length;i++){
        const weekIndex=weekdays.indexOf(lines[i]);
        if(weekIndex>=0){weekday=weekIndex+1;continue}
        if(!/\(\d+(?:-\d+)?节\)/.test(lines[i]))continue;
        let name=lines[i-1]||"";
        if(!name||/^\d+$/.test(name)||/^\d{2}:\d{2}/.test(name))name="未命名课程";
        const detail=[lines[i]];
        for(let j=i+1;j<lines.length&&j<i+12;j++){
          if(/\(\d+(?:-\d+)?节\)/.test(lines[j]))break;
          detail.push(lines[j]);
          if(/学分[:：]/.test(lines[j]))break;
        }
        const item=parseCourseBlock(name,detail.join("/"),weekday);
        if(item)items.push(item);
      }
      return dedupe(items);
    }
    function lineKey(item){return [item.course_name,item.weekday,item.start_section,item.end_section,item.weeks,item.location,item.teacher].join("|")}
    function dedupe(items){const seen=new Set();return items.filter(item=>{const key=lineKey(item);if(seen.has(key))return false;seen.add(key);return true})}
    function parseColumnLines(lines,weekday){
      const items=[];
      for(let i=0;i<lines.length;i++){
        if(!/\(\d+(?:-\d+)?节\)/.test(lines[i]))continue;
        let nameParts=[];
        for(let j=i-1;j>=0&&j>=i-3;j--){
          if(/\(\d+(?:-\d+)?节\)/.test(lines[j]))break;
          if(/^(上午|中午|下午|晚上|时间段|节次)$/.test(lines[j]))break;
          if(/^\d+$/.test(lines[j])||/^\d{2}:\d{2}$/.test(lines[j]))break;
          nameParts.unshift(lines[j]);
        }
        const name=nameParts.join("").trim()||"未命名课程";
        const detail=[lines[i]];
        for(let j=i+1;j<lines.length&&j<i+12;j++){
          if(/\(\d+(?:-\d+)?节\)/.test(lines[j]))break;
          detail.push(lines[j]);
          if(/学分[:：]/.test(lines[j]))break;
        }
        const item=parseCourseBlock(name,detail.join("/"),weekday);
        if(item)items.push(item);
      }
      return items;
    }
    async function pdfToCourses(file){
      const pdfjsLib=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs");
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
      const data=new Uint8Array(await file.arrayBuffer());
      const pdf=await pdfjsLib.getDocument({data}).promise;
      const chunks=[],parsed=[];
      for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
        const page=await pdf.getPage(pageNo);
        const viewport=page.getViewport({scale:1});
        const content=await page.getTextContent();
        const pageLines=new Map();
        const columns=Array.from({length:7},()=>new Map());
        const left=viewport.width*0.18;
        const colWidth=(viewport.width-left)/7;
        content.items.filter(item=>String(item.str||"").trim()).forEach(item=>{
          const y=Math.round(item.transform[5]);
          const x=Math.round(item.transform[4]);
          const key=Array.from(pageLines.keys()).find(k=>Math.abs(k-y)<=3)||y;
          if(!pageLines.has(key))pageLines.set(key,[]);
          pageLines.get(key).push({x,text:item.str});
          if(x<left)return;
          const weekday=Math.max(1,Math.min(7,Math.floor((x-left)/colWidth)+1));
          const col=columns[weekday-1];
          const colKey=Array.from(col.keys()).find(k=>Math.abs(k-y)<=3)||y;
          if(!col.has(colKey))col.set(colKey,[]);
          col.get(colKey).push({x,text:item.str});
        });
        Array.from(pageLines.entries()).sort((a,b)=>b[0]-a[0]).forEach(([,parts])=>{chunks.push(parts.sort((a,b)=>a.x-b.x).map(part=>part.text).join(" ").replace(/\s+/g," ").trim())});
        columns.forEach((column,index)=>{const lines=Array.from(column.entries()).sort((a,b)=>b[0]-a[0]).map(([,parts])=>parts.sort((a,b)=>a.x-b.x).map(part=>part.text).join("").replace(/\s+/g,"").trim()).filter(Boolean);parsed.push(...parseColumnLines(lines,index+1))});
      }
      return {text:chunks.join("\n"),items:dedupe(parsed)};
    }
    function drawPreview(){
      $("previewList").innerHTML=previewItems.length?previewItems.map(item=>'<div class="item"><b>'+esc(item.course_name)+'</b><div class="pill-row"><span class="pill">'+esc(item.weekday_label)+'</span><span class="pill">第 '+esc(item.start_section)+'-'+esc(item.end_section)+' 节</span><span class="pill">'+esc(item.weeks)+'</span><span class="pill">'+esc(item.location||"未排地点")+'</span><span class="pill">'+esc(item.teacher||"未标注教师")+'</span></div></div>').join(""):'<div class="item"><b>暂无预览</b><span class="meta">上传 PDF 或粘贴课表文本后会显示在这里</span></div>';
    }
    async function drawSaved(){
      const data=await api("/api/timetable").catch(()=>({items:[]}));
      const items=data.items||[];
      $("courseGrid").innerHTML=weekdays.map((day,index)=>{const courses=items.filter(item=>Number(item.weekday)===index+1);return '<div class="day-col"><h4>'+day+'</h4>'+(courses.length?courses.map(item=>'<div class="course-card"><b>'+esc(item.course_name)+'</b><span class="meta">第 '+esc(item.start_section)+'-'+esc(item.end_section)+' 节 / '+esc(item.weeks)+'</span><span class="meta">'+esc(item.location||"未排地点")+' / '+esc(item.teacher||"未标注教师")+'</span><button class="danger" data-del-course="'+esc(item.id)+'">删除</button></div>').join(""):'<div class="course-card"><span class="meta">暂无课程</span></div>')+'</div>'}).join("");
      document.querySelectorAll("[data-del-course]").forEach(btn=>btn.onclick=async()=>{await api("/api/timetable?id="+encodeURIComponent(btn.dataset.delCourse),{method:"DELETE"});drawSaved()});
    }
    async function init(){
      const session=await api("/api/session").catch(()=>({role:"visitor"}));
      if(session.role!=="admin")return;
      $("timetableLocked").style.display="none";
      $("timetableApp").style.display="grid";
      drawPreview();
      await drawSaved();
      $("parsePdfBtn").onclick=async()=>{const file=$("pdfFile").files[0];if(!file){notice("请先选择 PDF 文件。");return}notice("正在解析 PDF...");const result=await pdfToCourses(file);$("rawText").value=result.text;previewItems=result.items.length?result.items:parseText(result.text);drawPreview();notice("已解析 "+previewItems.length+" 条课程，请检查预览。")};
      $("parseTextBtn").onclick=()=>{previewItems=parseText($("rawText").value);drawPreview();notice("已从文本解析 "+previewItems.length+" 条课程。")};
      $("savePreviewBtn").onclick=async()=>{if(!previewItems.length){notice("没有可保存的预览。");return}await api("/api/timetable",{method:"POST",body:JSON.stringify({replace:true,items:previewItems})});notice("已保存 "+previewItems.length+" 条课程到云端。");drawSaved()};
      $("clearTimetableBtn").onclick=async()=>{await api("/api/timetable",{method:"DELETE"});previewItems=[];drawPreview();drawSaved();notice("已清空云端课表。")};
    }
    init();
  </script>
</body>
</html>
