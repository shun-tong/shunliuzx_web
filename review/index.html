<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>复习计划 / shunliuzx.com</title>
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    .review-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.review-metrics .item{min-height:92px}.bar{height:8px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:min(var(--value),100%);background:var(--accent)}.locked{max-width:620px}.quick-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.quick-row button{min-height:34px;font-size:12px}.summary-gap b{color:var(--accent-2)}.summary-gap.safe b{color:var(--accent)}@media(max-width:860px){.review-metrics,.quick-row{grid-template-columns:1fr}}
  </style>
</head>
<body data-page="review" data-theme="wolf">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="mark">SL</div><div><h1>复习计划</h1><p>Exam review budget</p></div></div>
      <nav class="nav">
        <a href="/"><b>控制台</b><span>HOME</span></a>
        <a href="/quotes/"><b>名句档案</b><span>Q-01</span></a>
        <a href="/schedule/"><b>日程备忘</b><span>S-02</span></a>
        <a href="/blog/"><b>记录库</b><span>B-03</span></a>
        <a class="active" href="/review/"><b>复习计划</b><span>R-04</span></a>
        <a href="/timetable/"><b>课表</b><span>T-05</span></a>
      </nav>
      <div class="themebox"><div class="seg"><button data-theme-set="wolf">冷白</button><button data-theme-set="amber">琥珀</button></div></div>
    </aside>
    <main class="content">
      <section class="topline"><div><div class="kicker">R-04 / Admin Only</div><h2>复习计划</h2></div><div class="statusbar"><span class="chip">EXAM CLOCK</span><span class="chip">PRIVATE</span></div></section>
      <section class="grid" id="reviewLocked">
        <div class="panel span-8 locked">
          <h3>需要管理员权限</h3>
          <p>这个板块保存你的考试复习安排，游客不可见。请在左侧输入管理员口令登录。</p>
        </div>
      </section>
      <section class="grid" id="reviewApp" style="display:none">
        <div class="panel span-4">
          <h3>添加科目</h3>
          <form class="form" id="subjectForm">
            <input id="subjectName" required placeholder="科目，例如 高等数学">
            <input id="subjectTotal" type="number" min="0" step="0.5" required placeholder="总共需要复习小时">
            <input id="subjectSpent" type="number" min="0" step="0.5" value="0" placeholder="当前已花小时">
            <label>期末考试日期</label>
            <input id="subjectExam" type="date" required>
            <div class="quick-row">
              <button type="button" data-exam-days="7">7天后</button>
              <button type="button" data-exam-days="14">14天后</button>
              <button type="button" data-exam-days="30">30天后</button>
            </div>
            <textarea id="subjectNote" placeholder="备注"></textarea>
            <button class="primary" type="submit">加入科目</button>
          </form>
        </div>
        <div class="panel span-4">
          <h3>添加每日可用时间</h3>
          <form class="form" id="dayForm">
            <label>日期</label>
            <input id="dayDate" type="date" required>
            <div class="quick-row">
              <button type="button" data-day-shift="0">今天</button>
              <button type="button" data-day-shift="1">明天</button>
              <button type="button" data-day-shift="7">7天后</button>
            </div>
            <input id="dayHours" type="number" min="0" step="0.5" required placeholder="当天可用于复习小时">
            <textarea id="dayNote" placeholder="备注"></textarea>
            <button class="primary" type="submit">保存当天</button>
          </form>
        </div>
        <div class="panel span-4"><h3>总览</h3><div id="reviewSummary" class="quote-list"></div></div>
        <div class="panel span-8"><h3>科目预算</h3><div id="subjectList" class="quote-list"></div></div>
        <div class="panel span-4"><h3>每日时间</h3><div id="dayList" class="quote-list"></div></div>
      </section>
      <footer>© 2026 shunliuzx.com</footer>
    </main>
  </div>
  <script src="../assets/site.js"></script>
  <script>
    const $=id=>document.getElementById(id);
    const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(path,options){const res=await fetch(path,Object.assign({headers:{'content-type':'application/json'}},options||{}));const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'请求失败');return data}
    function dateAfter(days){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+Number(days||0));return d.toISOString().slice(0,10)}
    function todayISO(){return dateAfter(0)}
    function daysLeft(examDate){return Math.max(0,Math.ceil((new Date(examDate)-new Date(todayISO()))/(1000*60*60*24)))}
    function sumHoursUntil(days,examDate){const today=todayISO();return days.filter(day=>day.day>=today&&day.day<=examDate).reduce((total,day)=>total+Number(day.available_hours||0),0)}
    async function loadReview(){try{return await api('/api/review')}catch(e){return {subjects:[],days:[],error:e.message}}}
    async function drawReview(){const data=await loadReview();const subjects=data.subjects||[],days=data.days||[];const totalNeed=subjects.reduce((t,s)=>t+Math.max(Number(s.total_hours||0)-Number(s.spent_hours||0),0),0);const planned=days.filter(day=>day.day>=todayISO()).reduce((t,day)=>t+Number(day.available_hours||0),0);const totalGap=planned-totalNeed;$('reviewSummary').innerHTML='<div class="item"><b>'+subjects.length+'</b><span class="meta">科目数量</span></div><div class="item"><b>'+totalNeed.toFixed(1)+'h</b><span class="meta">总剩余需求</span></div><div class="item"><b>'+planned.toFixed(1)+'h</b><span class="meta">未来可用时间</span></div><div class="item summary-gap '+(totalGap>=0?'safe':'')+'"><b>'+(totalGap>=0?'+':'-')+Math.abs(totalGap).toFixed(1)+'h</b><span class="meta">'+(totalGap>=0?'总富余':'总缺口')+'</span></div>';$('subjectList').innerHTML=subjects.length?subjects.map(s=>{const remaining=Math.max(Number(s.total_hours||0)-Number(s.spent_hours||0),0);const available=sumHoursUntil(days,s.exam_date);const progress=Number(s.total_hours||0)>0?Math.min(Number(s.spent_hours||0)/Number(s.total_hours||0)*100,100):0;return '<div class="item"><b>'+esc(s.name)+'</b><div class="meta">考试：'+esc(s.exam_date)+' / 剩余 '+daysLeft(s.exam_date)+' 天</div><div class="review-metrics"><div class="item"><b>'+Number(s.total_hours||0).toFixed(1)+'h</b><span class="meta">总需求</span></div><div class="item"><b>'+Number(s.spent_hours||0).toFixed(1)+'h</b><span class="meta">已完成</span></div><div class="item"><b>'+remaining.toFixed(1)+'h</b><span class="meta">还需要</span></div></div><div class="bar" style="--value:'+progress.toFixed(0)+'%"><i></i></div><p>到这科考试前已填写可用时间：'+available.toFixed(1)+'h</p><div class="auth-row"><input data-spent="'+esc(s.id)+'" type="number" min="0" step="0.5" value="'+esc(s.spent_hours)+'"><button data-save-spent="'+esc(s.id)+'">更新已花</button></div><button class="danger" data-del-subject="'+esc(s.id)+'">删除科目</button></div>'}).join(''):'<div class="item"><b>暂无科目</b><span class="meta">先添加一个期末科目</span></div>';$('dayList').innerHTML=days.length?days.map(day=>'<div class="item"><b>'+esc(day.day)+'</b><div class="meta">'+Number(day.available_hours||0).toFixed(1)+'h 可用于复习</div><p>'+esc(day.note)+'</p><button class="danger" data-del-day="'+esc(day.id)+'">删除</button></div>').join(''):'<div class="item"><b>暂无每日时间</b><span class="meta">按天填写可用复习时间</span></div>';document.querySelectorAll('[data-save-spent]').forEach(btn=>btn.onclick=async()=>{const input=document.querySelector('[data-spent="'+btn.dataset.saveSpent+'"]');await api('/api/review',{method:'PATCH',body:JSON.stringify({id:btn.dataset.saveSpent,spent_hours:input.value})});drawReview()});document.querySelectorAll('[data-del-subject]').forEach(btn=>btn.onclick=async()=>{await api('/api/review?type=subject&id='+encodeURIComponent(btn.dataset.delSubject),{method:'DELETE'});drawReview()});document.querySelectorAll('[data-del-day]').forEach(btn=>btn.onclick=async()=>{await api('/api/review?type=day&id='+encodeURIComponent(btn.dataset.delDay),{method:'DELETE'});drawReview()})}
    function wireDateButtons(){document.querySelectorAll('[data-exam-days]').forEach(btn=>btn.onclick=()=>subjectExam.value=dateAfter(btn.dataset.examDays));document.querySelectorAll('[data-day-shift]').forEach(btn=>btn.onclick=()=>dayDate.value=dateAfter(btn.dataset.dayShift));dayDate.value=todayISO()}
    async function initReview(){wireDateButtons();const session=await api('/api/session').catch(()=>({role:'visitor'}));if(session.role!=='admin')return;$('reviewLocked').style.display='none';$('reviewApp').style.display='grid';$('subjectForm').onsubmit=async e=>{e.preventDefault();await api('/api/review',{method:'POST',body:JSON.stringify({type:'subject',name:subjectName.value.trim(),total_hours:subjectTotal.value,spent_hours:subjectSpent.value,exam_date:subjectExam.value,note:subjectNote.value.trim()})});subjectForm.reset();drawReview()};$('dayForm').onsubmit=async e=>{e.preventDefault();await api('/api/review',{method:'POST',body:JSON.stringify({type:'day',day:dayDate.value,available_hours:dayHours.value,note:dayNote.value.trim()})});dayForm.reset();dayDate.value=todayISO();drawReview()};drawReview()}
    initReview();
  </script>
</body>
</html>
