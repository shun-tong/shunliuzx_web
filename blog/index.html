<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>记录库 / shunliuzx.com</title>
  <link rel="stylesheet" href="../assets/site.css">
  <style>
    .admin-panel{display:none}.admin-panel.active{display:block}.toggle-line{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.toggle-line input{width:auto}.post-content{white-space:pre-wrap}.post-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden-mark{color:var(--accent-2)}
  </style>
</head>
<body data-page="blog" data-theme="wolf">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="mark">SL</div><div><h1>记录库</h1><p>Field notes</p></div></div>
      <nav class="nav">
        <a href="/"><b>控制台</b><span>HOME</span></a>
        <a href="/quotes/"><b>名句档案</b><span>Q-01</span></a>
        <a href="/schedule/"><b>日程备忘</b><span>S-02</span></a>
        <a class="active" href="/blog/"><b>记录库</b><span>B-03</span></a>
        <a href="/review/"><b>复习计划</b><span>R-04</span></a>
        <a href="/timetable/"><b>课表</b><span>T-05</span></a>
      </nav>
      <div class="themebox"><div class="seg"><button data-theme-set="wolf">冷白</button><button data-theme-set="amber">琥珀</button></div></div>
    </aside>
    <main class="content">
      <section class="topline"><div><div class="kicker">B-03 / Notes</div><h2>记录库</h2></div><div class="statusbar"><span class="chip">VISITOR PREVIEW</span><span class="chip">ADMIN PUBLISH</span></div></section>
      <section class="grid">
        <div class="panel span-4 admin-panel" id="blogAdminPanel">
          <h3>发布文章</h3>
          <form class="form" id="blogForm">
            <input id="blogId" type="hidden">
            <input id="blogTitle" required placeholder="标题">
            <input id="blogTag" placeholder="标签，例如 随笔">
            <textarea id="blogSummary" placeholder="预览摘要"></textarea>
            <textarea id="blogContent" required placeholder="正文"></textarea>
            <label class="toggle-line"><input id="blogVisible" type="checkbox" checked> 游客可见</label>
            <button class="primary" type="submit">发布</button>
            <button type="button" id="blogCancelEdit">取消编辑</button>
          </form>
        </div>
        <div class="panel span-8">
          <h3>文章预览</h3>
          <div class="post-list" id="postList"></div>
        </div>
      </section>
      <footer>© 2026 shunliuzx.com</footer>
    </main>
  </div>
  <script src="../assets/site.js"></script>
  <script>
    const $=id=>document.getElementById(id);
    const esc=value=>String(value||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    async function api(path,options){const res=await fetch(path,Object.assign({headers:{"content-type":"application/json"}},options||{}));const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||"请求失败");return data}
    function time(value){return value?new Date(value).toLocaleDateString("zh-CN"):"未标注日期"}
    function resetForm(){blogForm.reset();blogId.value="";blogVisible.checked=true;blogForm.querySelector("button.primary").textContent="发布"}
    async function loadPosts(){return (await api("/api/blogs")).items||[]}
    function renderPosts(posts,isAdmin){
      const visiblePosts=isAdmin?posts:posts.filter(post=>post.visible);
      $("postList").innerHTML=visiblePosts.length?visiblePosts.map(post=>'<article class="item"><b>'+esc(post.title)+'</b><div class="meta">'+esc(post.tag||"随笔")+' / '+time(post.created_at)+(post.visible?'':' / <span class="hidden-mark">游客隐藏</span>')+'</div><p>'+esc(post.summary||"")+'</p><div class="post-content">'+esc(post.content||"")+'</div>'+(isAdmin?'<div class="post-actions"><button data-edit="'+esc(post.id)+'">编辑</button><button class="danger" data-delete="'+esc(post.id)+'">删除</button></div>':"")+'</article>').join(""):'<div class="item"><b>暂无公开文章</b><span class="meta">管理员发布后会出现在这里</span></div>';
      if(!isAdmin)return;
      document.querySelectorAll("[data-edit]").forEach(btn=>btn.onclick=()=>{const post=posts.find(item=>String(item.id)===String(btn.dataset.edit));if(!post)return;blogId.value=post.id;blogTitle.value=post.title||"";blogTag.value=post.tag||"";blogSummary.value=post.summary||"";blogContent.value=post.content||"";blogVisible.checked=!!post.visible;blogForm.querySelector("button.primary").textContent="保存修改";window.scrollTo({top:0,behavior:"smooth"})});
      document.querySelectorAll("[data-delete]").forEach(btn=>btn.onclick=async()=>{await api("/api/blogs?id="+encodeURIComponent(btn.dataset.delete),{method:"DELETE"});initBlog()});
    }
    async function initBlog(){
      const session=await api("/api/session").catch(()=>({role:"visitor"}));
      const isAdmin=session.role==="admin";
      $("blogAdminPanel").classList.toggle("active",isAdmin);
      const posts=await loadPosts().catch(()=>[]);
      renderPosts(posts,isAdmin);
      if(!isAdmin)return;
      blogForm.onsubmit=async event=>{event.preventDefault();const payload={id:blogId.value,title:blogTitle.value.trim(),tag:blogTag.value.trim()||"随笔",summary:blogSummary.value.trim(),content:blogContent.value.trim(),visible:blogVisible.checked};await api("/api/blogs",{method:blogId.value?"PATCH":"POST",body:JSON.stringify(payload)});resetForm();initBlog()};
      blogCancelEdit.onclick=resetForm;
    }
    initBlog();
  </script>
</body>
</html>
